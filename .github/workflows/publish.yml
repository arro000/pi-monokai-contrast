name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check npm version (Node 24 includes npm 11)
        run: npm --version
      - name: Check package identity and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@arro000/pi-monokai-contrast');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(
            process.env.RELEASE_TAG, `v${pkg.version}`,
            'Tag must match package.json version',
          );
          JS
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish public package with provenance
        run: npm publish --access public --provenance
        env:
          # Bootstrap only. Remove secret after enabling npm trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
